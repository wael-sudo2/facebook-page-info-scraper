name: Publish Python 🐍 package 📦 to PyPI

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build

      # A tag and version.py that disagree would publish the wrong version
      # under the right tag, and PyPI does not allow re-uploads.
      - name: Check tag matches version.py
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG=$(python -c "import re;print(re.search(r'\"(.+)\"',open('facebook_page_info_scraper/version.py').read()).group(1))")
          TAG="${GITHUB_REF_NAME#v}"
          echo "version.py=$PKG  tag=$TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag v$TAG does not match version.py ($PKG)"
            exit 1
          fi

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI 🚀
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    # Must match the "Environment name" configured on PyPI's trusted
    # publisher for this project - PyPI validates it against the OIDC claim.
    environment:
      name: release
      url: https://pypi.org/project/facebook-page-info-scraper/

    permissions:
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # PyPI refuses a re-upload, so without this a re-run triggered by
          # a LATER job failing would die here instead of reaching the job
          # that actually needs retrying.
          skip-existing: true

  github-release:
    name: Create GitHub Release 🏷️
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish-to-pypi
    runs-on: ubuntu-latest

    # Sigstore signing used to run here. It failed on every tag from v2.0.0
    # onward - the upstream floating tag it referenced was withdrawn - so no
    # GitHub release was ever created, unnoticed because PyPI publishing had
    # already succeeded. Dropped rather than repaired: gh-action-pypi-publish
    # emits PEP 740 attestations for trusted publishing, which covers the
    # provenance those signatures were duplicating.
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" dist/** \
            --repo "${{ github.repository }}"
