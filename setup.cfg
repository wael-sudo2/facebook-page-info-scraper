# setup.cfg
[metadata]
name = facebook_page_info_scraper
version = attr: facebook_page_info_scraper.version.__version__
author = Wael Hkiri
author_email = wael.hkiri.dev@gmail.com
keywords =
    facebook
    facebook scraper
    facebook page
    facebook crawler
    scraping
    scraper
    crawler
    web scraping
    playwright
    scrapy
    lead generation
    contact extraction

description = Fast Facebook page scraper - public page info as a Python dict, no browser required.
long_description = file: README.md
long_description_content_type = text/markdown

url = https://github.com/wael-sudo2/facebook-page-info-scraper
download_url = https://github.com/wael-sudo2/facebook-page-info-scraper/archive/refs/tags/v2.1.0.tar.gz

project_urls =
    Source = https://github.com/wael-sudo2/facebook-page-info-scraper
    Issues = https://github.com/wael-sudo2/facebook-page-info-scraper/issues
    Changelog = https://github.com/wael-sudo2/facebook-page-info-scraper/releases

license = MIT
license_files = LICENSE.txt

classifiers =
    # for a full list of classifiers see https://pypi.org/classifiers/
    Development Status :: 5 - Production/Stable
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Internet :: WWW/HTTP :: Indexing/Search
    Topic :: Software Development :: Libraries :: Python Modules
    Topic :: Text Processing :: Markup :: HTML

[options]
install_requires =
    # HTTP engine
    requests>=2.28
    # Browser engine. scrapy-playwright pulls in playwright, which ships the
    # driver but NOT the browser binary - pip has no post-install hook for
    # wheels. spider.run() downloads Chromium on first use instead.
    scrapy>=2.11
    scrapy-playwright>=0.0.34
    # Enrichment: classifies an email local part as a company inbox or a
    # person. Serves both OpenAI and DeepSeek - one wire protocol, two
    # vendors. The package ships; the API key is the caller's to supply.
    openai>=1.40
    # Enrichment: retries bot-challenged company sites with a real browser's
    # TLS fingerprint.
    curl_cffi>=0.7
python_requires = >=3.10

[options.extras_require]
# Legacy 1.x Selenium class only. Kept out of the base install because
# googletrans 4.0.0rc1 pins an ancient httpx and breaks dependency
# resolution for everything else in the environment.
selenium =
    selenium~=4.8
    geopy~=2.2
    retry~=0.9.2
    webdriver-manager~=4.0
    googletrans~=4.0.0rc1
